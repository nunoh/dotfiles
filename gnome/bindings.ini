[org/gnome/desktop/wm/keybindings]
close=['<Super>w']
maximize=['<Super>Up']
minimize=['<Super>m']
move-to-workspace-1=['<Shift><Control>1']
move-to-workspace-2=['<Shift><Control>2']
switch-applications=['<Alt>Tab']
switch-applications-backward=['<Shift><Alt>Tab']
switch-input-source=@as []
switch-input-source-backward=@as []
switch-to-workspace-left=['<Control>Left']
switch-to-workspace-right=['<Control>Right']
switch-windows=['<Super>Tab']
switch-windows-backward=['<Shift><Super>Tab']
unmaximize=['<Super>Down']

[org/gnome/shell/keybindings]
screenshot-window=['<Shift><Alt><Super>3']
show-screenshot-ui=['<Shift><Super>4']
toggle-application-view=@as []
toggle-message-tray=@as []
toggle-overview=['<Super>e']

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ulauncher/']
logout=['<Super><Shift>q']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>space'
command='vicinae toggle'
name='Vicinae'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Control><Super>c'
command='vicinae deeplink vicinae://launch/clipboard/history'
name='Vicinae Clipboard'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding=''
command='flatpak run com.tomjwatson.Emote'
name='Emote'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3]
binding='<Control><Super>space'
command='gnome-characters'
name='Gnome Characters'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ulauncher]
binding='<Control>space'
command='/home/nuno/.local/bin/ulauncher'
name='uLauncher'
