# Ghostty shared config.
# Loaded on macOS and Linux.

# Appearance
font-family = "FiraCode Nerd Font Mono"
font-size = 12

cursor-style = block
cursor-style-blink = false

background-opacity = 1.00
window-padding-x = 4
window-padding-y = 4

# macOS settings are ignored by Linux builds.
macos-option-as-alt = left
macos-titlebar-style = tabs
macos-non-native-fullscreen = visible-menu

# Shell / behavior
shell-integration = detect
shell-integration-features = no-cursor
copy-on-select = false
confirm-close-surface = false
mouse-hide-while-typing = true

# Send alt+enter on shift+enter so apps that expect alt+enter for "soft newline"
# (e.g. hermes-agent) get the right input. Overrides kitty-protocol encoding for this key.
keybind = shift+enter=text:\x1b\r

# Keep the core macOS tab shortcut working even if the optional overlay has not
# been stowed on a machine yet. Ghostty treats `cmd` as an alias for `super`.
keybind = super+t=new_tab

# Pane navigation (vim-style, shared with tmux)
keybind = ctrl+h=goto_split:left
keybind = ctrl+j=goto_split:bottom
keybind = ctrl+k=goto_split:top
keybind = ctrl+l=goto_split:right

# macOS-style tabs
keybind = cmd+w=close_surface
keybind = cmd+shift+]=next_tab
keybind = cmd+shift+[=previous_tab
keybind = cmd+1=goto_tab:1
keybind = cmd+2=goto_tab:2
keybind = cmd+3=goto_tab:3
keybind = cmd+4=goto_tab:4
keybind = cmd+5=goto_tab:5
keybind = cmd+6=goto_tab:6
keybind = cmd+7=goto_tab:7
keybind = cmd+8=goto_tab:8
keybind = cmd+9=last_tab

# macOS-style splits
keybind = cmd+d=new_split:right
keybind = cmd+shift+d=new_split:down

# Pane resize
keybind = cmd+ctrl+h=resize_split:left,10
keybind = cmd+ctrl+j=resize_split:down,10
keybind = cmd+ctrl+k=resize_split:up,10
keybind = cmd+ctrl+l=resize_split:right,10

# Clear
keybind = cmd+r=text:\x0c
keybind = cmd+k=clear_screen

# macOS-only until Ghostty implements this on GTK.
keybind = cmd+u=toggle_background_opacity

# Quick terminal
keybind = global:cmd+escape=toggle_quick_terminal
